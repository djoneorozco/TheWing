    /* ==========================================================

    #tw-vf-results .tw-vf-groups {

    #tw-vf-results .tw-vf-group {

    #tw-vf-results .tw-vf-label {

    #tw-vf-results .tw-vf-options {

    /* ==========================================================
       SYNONYM

    #tw-vf-results .tw-vf-option {
      appearance:none;

      align-items:center;

      background:#fff;

      font-family:inherit;

    #tw-vf-results
    .tw-vf-option[data-same="1"]

    /* ==========================================================

    #tw-vf-results[data-empty="1"]

      }
      #tw-vf-results .tw-vf-group {

      }

        margin-bottom:7px;
      }
    }
  </style>
      <!--  ========================================================
       RESULTS
  =========================================================  -->
      <div class="tw-vf-card">
        <div class="tw-vf-top">
          <h3 class="tw-vf-word" id="tw-vf-result-word">
            Led
          </h3>
          <span class="tw-vf-length" id="tw-vf-result-length">
            3 characters
          </span>
          <button class="tw-vf-x" id="tw-vf-result-close" type="button" aria-label="Close">
            ×
          </button>
        </div>
        <div class="tw-vf-no-results">
          No Verb Fit options are available for this verb yet.
        </div>
        <div class="tw-vf-groups">
          <!--  SAME LENGTH  -->
          <div class="tw-vf-group" id="tw-vf-group-same">
            <div class="tw-vf-label">
              Same Length
            </div>
            <div class="tw-vf-options" id="tw-vf-results-same"></div>
          </div>
          <!--  CLOSE  -->
          <div class="tw-vf-group" id="tw-vf-group-close">
            <div class="tw-vf-label">
              Close Fit
            </div>
            <div class="tw-vf-options" id="tw-vf-results-close"></div>
          </div>
          <!--  MORE  -->
          <div class="tw-vf-group" id="tw-vf-group-more">
            <div class="tw-vf-label">
              More Options
            </div>
            <div class="tw-vf-options" id="tw-vf-results-more"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
(function () {
  'use strict';
  /* ==========================================================
     WAIT UNTIL WEBFLOW / DOM IS READY
  ========================================================== */
  function startVerbFit() {
    /* ========================================================
       SEARCH ELEMENTS LOCATED IN YOUR NAVIGATION
    ======================================================== */
    const input =
      document.getElementById('tw-vf-input');
    const findButton =
      document.getElementById('tw-vf-submit');
    /* ========================================================
       RESULT ELEMENTS
    ======================================================== */
    const results =
      document.getElementById('tw-vf-results');
    const resultWord =
      document.getElementById('tw-vf-result-word');
    const resultLength =
      document.getElementById('tw-vf-result-length');
    const sameBox =
      document.getElementById('tw-vf-results-same');
    const closeBox =
      document.getElementById('tw-vf-results-close');
    const moreBox =
      document.getElementById('tw-vf-results-more');
    const sameGroup =
      document.getElementById('tw-vf-group-same');
    const closeGroup =
      document.getElementById('tw-vf-group-close');
    const moreGroup =
      document.getElementById('tw-vf-group-more');
    const closeButton =
      document.getElementById('tw-vf-result-close');
    /* ========================================================
       DEBUG CHECK
    ======================================================== */
    if (!input) {
      console.error(
        'Verb Fit: #tw-vf-input was not found.'
      );
      return;
    }
    if (!findButton) {
      console.error(
        'Verb Fit: #tw-vf-submit was not found.'
      );
      return;
    }
    if (!results) {
      console.error(
        'Verb Fit: #tw-vf-results was not found.'
      );
      return;
    }
    /* ========================================================
       VERB DATABASE
    ======================================================== */
    const VERB_FAMILIES = [
      [
        'led',
        'ran',
        'drove',
        'guided',
        'headed',
        'managed',
        'oversaw',
        'steered',
        'directed',
        'championed',
        'spearheaded',
        'orchestrated'
      ],
      [
        'directed',
        'led',
        'guided',
        'headed',
        'managed',
        'oversaw',
        'steered',
        'supervised',
        'coordinated',
        'orchestrated',
        'spearheaded'
      ],
      [
        'managed',
        'led',
        'ran',
        'guided',
        'headed',
        'oversaw',
        'directed',
        'supervised',
        'administered',
        'coordinated'
      ],
      [
        'created',
        'made',
        'built',
        'formed',
        'designed',
        'launched',
        'developed',
        'established',
        'pioneered'
      ],
      [
        'improved',
        'grew',
        'raised',
        'boosted',
        'enhanced',
        'elevated',
        'optimized',
        'streamlined',
        'transformed'
      ],
      [
        'trained',
        'taught',
        'coached',
        'mentored',
        'educated',
        'instructed',
        'developed'
      ],
      [
        'executed',
        'ran',
        'performed',
        'completed',
        'delivered',
        'implemented',
        'accomplished',
        'achieved'
      ],
      [
        'coordinated',
        'synced',
        'linked',
        'aligned',
        'unified',
        'integrated',
        'synchronized'
      ],
      [
        'analyzed',
        'reviewed',
        'assessed',
        'examined',
        'evaluated',
        'validated'
      ],
      [
        'supported',
        'aided',
        'helped',
        'enabled',
        'assisted',
        'empowered',
        'facilitated'
      ],
      [
        'saved',
        'secured',
        'guarded',
        'protected',
        'preserved',
        'safeguarded'
      ]
    ];
    /* ========================================================
       NORMALIZE
    ======================================================== */
    function normalize(value) {
      return String(value || '')
        .trim()
        .replace(
          /^[^A-Za-z]+|[^A-Za-z]+$/g,
          ''
        )
        .toLowerCase();
    }
    /* ========================================================
       DISPLAY WORD
    ======================================================== */
    function displayWord(word) {
      if (!word) {
        return '';
      }
      return (
        word.charAt(0).toUpperCase() +
        word.slice(1)
      );
    }
    /* ========================================================
       GET SYNONYMS
    ======================================================== */
    function getSynonyms(source) {
      const matchedFamilies =
        VERB_FAMILIES.filter(
          family =>
            family.includes(source)
        );
      if (!matchedFamilies.length) {
        return [];
      }
      const words =
        new Set();
      matchedFamilies.forEach(
        family => {
          family.forEach(
            word => {
              if (word !== source) {
                words.add(word);
              }
            }
          );
        }
      );
      return Array
        .from(words)
        .map(
          word => {
            const delta =
              word.length -
              source.length;
            return {
              word,
              delta,
              difference:
                Math.abs(delta)
            };
          }
        )
        .sort(
          (a,b) => {
            if (
              a.difference !==
              b.difference
            ) {
              return (
                a.difference -
                b.difference
              );
            }
            if (
              a.delta !==
              b.delta
            ) {
              return (
                a.delta -
                b.delta
              );
            }
            return (
              a.word.localeCompare(
                b.word
              )
            );
          }
        );
    }
    /* ========================================================
       DELTA
    ======================================================== */
    function deltaText(delta) {
      if (delta === 0) {
        return '0';
      }
      if (delta > 0) {
        return '+' + delta;
      }
      return String(delta);
    }
    /* ========================================================
       CREATE OPTION
    ======================================================== */
    function makeOption(item) {
      const button =
        document.createElement(
          'button'
        );
      button.type =
        'button';
      button.className =
        'tw-vf-option';
      if (item.delta === 0) {
        button.dataset.same =
          '1';
      }
      const word =
        document.createElement(
          'span'
        );
      word.textContent =
        displayWord(item.word);
      const delta =
        document.createElement(
          'span'
        );
      delta.className =
        'tw-vf-delta';
      delta.textContent =
        deltaText(item.delta);
      button.appendChild(word);
      button.appendChild(delta);
      /* ------------------------------------------------------
         CLICKING AN OPTION SEARCHES THAT VERB
      ------------------------------------------------------ */
      button.addEventListener(
        'click',
        function () {
          input.value =
            displayWord(item.word);
          runSearch();
        }
      );
      return button;
    }
    /* ========================================================
       RENDER GROUP
    ======================================================== */
    function renderGroup(
      items,
      box,
      group
    ) {
      box.innerHTML =
        '';
      if (!items.length) {
        group.style.display =
          'none';
        return;
      }
      group.style.display =
        'flex';
      items.forEach(
        item => {
          box.appendChild(
            makeOption(item)
          );
        }
      );
    }
    /* ========================================================
       SEARCH
    ======================================================== */
    function runSearch() {
      const source =
        normalize(input.value);
      if (!source) {
        input.focus();
        return;
      }
      console.log(
        'Verb Fit search:',
        source
      );
      resultWord.textContent =
        displayWord(source);
      resultLength.textContent =
        source.length +
        (
          source.length === 1
            ? ' character'
            : ' characters'
        );
      const synonyms =
        getSynonyms(source);
      /* ------------------------------------------------------
         OPEN PANEL
      ------------------------------------------------------ */
      results.dataset.open =
        '1';
      /* ------------------------------------------------------
         UNKNOWN WORD
      ------------------------------------------------------ */
      if (!synonyms.length) {
        results.dataset.empty =
          '1';
        return;
      }
      results.dataset.empty =
        '0';
      /* ------------------------------------------------------
         SAME LENGTH
      ------------------------------------------------------ */
      const same =
        synonyms.filter(
          item =>
            item.delta === 0
        );
      /* ------------------------------------------------------
         CLOSE FIT ±1 TO ±3
      ------------------------------------------------------ */
      const close =
        synonyms.filter(
          item =>
            item.delta !== 0 &&
            item.difference <= 3
        );
      /* ------------------------------------------------------
         OTHER OPTIONS
      ------------------------------------------------------ */
      const more =
        synonyms.filter(
          item =>
            item.difference > 3
        );
      renderGroup(
        same,
        sameBox,
        sameGroup
      );
      renderGroup(
        close,
        closeBox,
        closeGroup
      );
      renderGroup(
        more,
        moreBox,
        moreGroup
      );
    }
    /* ========================================================
       FIND BUTTON
    ======================================================== */
    findButton.addEventListener(
      'click',
      function (event) {
        event.preventDefault();
        runSearch();
      }
    );
    /* ========================================================
       ENTER KEY
    ======================================================== */
    input.addEventListener(
      'keydown',
      function (event) {
        if (
          event.key ===
          'Enter'
        ) {
          event.preventDefault();
          runSearch();
        }
      }
    );
    /* ========================================================
       CLOSE
    ======================================================== */
    if (closeButton) {
      closeButton.addEventListener(
        'click',
        function () {
          results.dataset.open =
            '0';
        }
      );
    }
    console.log(
      'Verb Fit initialized successfully.'
    );
  }
  /* ==========================================================
     SAFE WEBFLOW LOAD
  ========================================================== */
  if (
    document.readyState ===
    'loading'
  ) {
    document.addEventListener(
      'DOMContentLoaded',
      startVerbFit
    );
  } else {
    startVerbFit();
  }
})();
</script>
  </div>

      </iframe>
