    /* ======================================================

        var(--image)
        center center /
        cover

        0 5px 18px rgba(0,0,0,.22);
    }

    ====================================================== */
    #tw-create-hud .tw-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgba(3,7,13,.24) 0%,
          rgba(3,7,13,.16) 38%,
          rgba(3,7,13,.03) 64%,
          rgba(3,7,13,0) 100%

        linear-gradient(
          180deg,
          rgba(0,0,0,.02) 0%,
          rgba(0,0,0,0) 65%,
          rgba(0,0,0,.16) 100%

    }

       SUBTLE TECH GRAIN

    #tw-create-hud .tw-grain {

      inset: 0;

    #tw-create-hud .tw-panel {

        Increased HUD height.

          rgba(255,255,255,.035) 38%,
          transparent 65%
        ),
        radial-gradient(
          100% 80% at 100% 100%,

        translateZ(0);

    #tw-create-hud .tw-panel::before,

        2px solid

      border-radius:

    #tw-create-hud .tw-panel::after {
      right: 8px;

      border-bottom:
        2px solid
        var(--gold);
      border-radius:
        0 0 6px 0;

       MOVING HUD SCAN

    #tw-create-hud .tw-scan {

      right: 0;
      z-index: 4;

        transform:

        box-shadow:
          0 0 12px
          rgba(242,204,134,.90);

       MAIN CONTENT
    ====================================================== */
    #tw-create-hud .tw-content {
      position: relative;
      z-index: 6;
      display: flex;
      flex-direction: column;
      flex: 1;

    /* ======================================================
