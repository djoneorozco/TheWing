  <video id="pcsu-404-video" autoplay="" muted="" playsinline="" webkit-playsinline="" preload="auto"></video>
  <script>
document.addEventListener("DOMContentLoaded", function () {
  const video = document.getElementById("pcsu-404-video");
  const HOME_URL = "/";
  const MOBILE_VIDEO =
    "https://raw.githubusercontent.com/djoneorozco/TheWing.ai/main/images/Amyiphone.mp4";
  const DESKTOP_VIDEO =
    "https://raw.githubusercontent.com/djoneorozco/TheWing.ai/main/images/404Video.mp4";
  if (!video) return;
  const isPhone = window.matchMedia("(max-width: 767px)").matches;
  video.src = isPhone ? MOBILE_VIDEO : DESKTOP_VIDEO;
  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.addEventListener("loadedmetadata", function () {
    video.currentTime = 0;
  }, { once: true });
  video.play().catch(function (error) {
    console.error("Video autoplay failed:", error);
  });
  video.addEventListener("playing", function () {
    setTimeout(function () {
      window.location.href = HOME_URL;
    }, 5250);
  }, { once: true });
});
</script>
