  ========================================================== */
  function rebuildIndex() {
    familyIndex = new Map();
    VERB_FAMILIES.forEach((family, familyIdx) => {
      family.words.forEach((word) => {
        const key = normalizeWord(word);
        if (!key) return;
        if (!familyIndex.has(key)) {
          familyIndex.set(key, new Set());
        }
        familyIndex.get(key).add(familyIdx);
      });
    });
  }
  /* ==========================================================
     CACHE SHELL ELEMENTS
  ========================================================== */
  function cacheElements() {
    root = document.getElementById(ROOT_ID);
    if (!root) return false;
    els.empty =
      root.querySelector('[data-vf-empty]');
    els.active =
      root.querySelector('[data-vf-active]');
    els.word =
      root.querySelector('[data-vf-word]');
    els.wordChars =
      root.querySelector('[data-vf-word-chars]');
    els.statementCount =
      root.querySelector('[data-vf-statement-count]');
    els.sameWrap =
      root.querySelector('[data-vf-same-wrap]');
    els.same =
      root.querySelector('[data-vf-same]');
    els.closeWrap =
      root.querySelector('[data-vf-close-wrap]');
    els.close =
      root.querySelector('[data-vf-close]');
    els.otherWrap =
      root.querySelector('[data-vf-other-wrap]');
    els.other =
      root.querySelector('[data-vf-other]');
    els.more =
      root.querySelector('[data-vf-more]');
    els.message =
      root.querySelector('[data-vf-message]');
    return true;
  }
  /* ==========================================================
     TARGET FIELD
  ========================================================== */
  function isTarget(el) {
    return (
      el &&
      el.matches &&
      el.matches(TARGET_SELECTOR)
    );
  }
  function getMaxChars(el) {
    const customMax =
      Number(el?.dataset?.twMax);
    if (
      Number.isFinite(customMax) &&
      customMax > 0
    ) {
      return customMax;
    }
    const nativeMax =
      Number(el?.getAttribute?.('maxlength'));
    if (
      Number.isFinite(nativeMax) &&
      nativeMax > 0
    ) {
      return nativeMax;
    }
    return DEFAULT_MAX;
  }
  /* ==========================================================
     WORD DETECTION
  ========================================================== */
  function isWordChar(char) {
    return /[A-Za-z]/.test(char || '');
  }
  function getWordRange(el) {
    if (
      !el ||
      typeof el.value !== 'string'
    ) {
      return null;
    }
    const value = el.value;
    let start =
      Number.isInteger(el.selectionStart)
        ? el.selectionStart
        : 0;
    let end =
      Number.isInteger(el.selectionEnd)
        ? el.selectionEnd
        : start;
    /* --------------------------------------------------------
       If user selected one word, use selection.
    -------------------------------------------------------- */
    if (end > start) {
      const raw =
        value.slice(start, end);
      const leftTrim =
        raw.search(/[A-Za-z]/);
      const matches =
        raw.match(/[A-Za-z]+/g);
      if (
        matches &&
        matches.length === 1 &&
        leftTrim >= 0
      ) {
        const word =
          matches[0];
        const wordStart =
          start + raw.indexOf(word);
        return {
          start: wordStart,
          end: wordStart + word.length,
          word
        };
      }
    }
    /* --------------------------------------------------------
       Otherwise detect word at cursor.
    -------------------------------------------------------- */
    let caret = start;
    if (
      caret === value.length &&
      caret > 0
    ) {
      caret -= 1;
    }
    if (
      !isWordChar(value[caret]) &&
      caret > 0 &&
      isWordChar(value[caret - 1])
    ) {
      caret -= 1;
    }
    if (!isWordChar(value[caret])) {
      return null;
    }
    let wordStart = caret;
    let wordEnd = caret + 1;
    while (
      wordStart > 0 &&
      isWordChar(value[wordStart - 1])
    ) {
      wordStart--;
    }
    while (
      wordEnd < value.length &&
      isWordChar(value[wordEnd])
    ) {
      wordEnd++;
    }
    const word =
      value.slice(wordStart, wordEnd);
    return word
      ? {
          start: wordStart,
          end: wordEnd,
          word
        }
      : null;
  }
  /* ==========================================================
     CAPITALIZATION
  ========================================================== */
  function detectCase(word) {
    if (!word) return 'lower';
    if (word === word.toUpperCase()) {
      return 'upper';
    }
    if (
      word[0] === word[0].toUpperCase() &&
      word.slice(1) ===
        word.slice(1).toLowerCase()
    ) {
      return 'title';
    }
    return 'lower';
  }
  function applyCase(word, sourceWord) {
    const mode =
      detectCase(sourceWord);
    if (mode === 'upper') {
      return word.toUpperCase();
    }
    if (mode === 'title') {
      return (
        word.charAt(0).toUpperCase() +
        word.slice(1)
      );
    }
    return word.toLowerCase();
  }
  /* ==========================================================
     FIND + RANK SYNONYMS
  ========================================================== */
  function getCandidates(word) {
    const key =
      normalizeWord(word);
    const families =
      familyIndex.get(key);
    if (
      !families ||
      !families.size
    ) {
      return [];
    }
    const unique =
      new Map();
    families.forEach((familyIdx) => {
      const family =
        VERB_FAMILIES[familyIdx];
      family.words.forEach((candidate) => {
        const normalized =
          normalizeWord(candidate);
        if (
          !normalized ||
          normalized === key
        ) {
          return;
        }
        if (!unique.has(normalized)) {
          unique.set(
            normalized,
            {
              word: normalized,
              families: new Set([
                family.name
              ])
            }
          );
        } else {
          unique
            .get(normalized)
            .families
            .add(family.name);
        }
      });
    });
    const sourceLen =
      key.length;
    return [...unique.values()]
      .map((item) => ({
        word:
          item.word,
        chars:
          item.word.length,
        delta:
          item.word.length -
          sourceLen,
        absDelta:
          Math.abs(
            item.word.length -
            sourceLen
          ),
        families:
          [...item.families]
      }))
      .sort((a, b) => {
        /*
          PRIORITY
          1. Same character length
          2. Closest character difference
          3. Shorter option
          4. Alphabetical
        */
        if (
          a.absDelta !== b.absDelta
        ) {
          return (
            a.absDelta -
            b.absDelta
          );
        }
        if (
          a.chars !== b.chars
        ) {
          return (
            a.chars -
            b.chars
          );
        }
        return (
          a.word.localeCompare(b.word)
        );
      });
  }
  /* ==========================================================
     CHARACTER DELTA
  ========================================================== */
  function deltaLabel(delta) {
    if (delta === 0) {
      return '0';
    }
    return delta > 0
      ? `+${delta}`
      : String(delta);
  }
  /* ==========================================================
     STATEMENT COUNTER
  ========================================================== */
  function setStatementCount(
    count,
    max,
    preview = false
  ) {
    if (!els.statementCount) {
      return;
    }
    els.statementCount.textContent =
      `${count}/${max}`;
    els.statementCount.dataset.over =
      count > max
        ? '1'
        : '0';
    els.statementCount.dataset.preview =
      preview
        ? '1'
        : '0';
  }
  function resetStatementCount() {
    if (!activeTarget) {
      return;
    }
    setStatementCount(
      activeTarget.value.length,
      getMaxChars(activeTarget),
      false
    );
  }
  /* ==========================================================
     CREATE VERB CHIP
  ========================================================== */
  function makeChip(candidate) {
    const button =
      document.createElement('button');
    button.type = 'button';
    button.className =
      'tw-vf-chip';
    button.dataset.word =
      candidate.word;
    const projected =
      activeTarget
        ? activeTarget.value.length +
          candidate.delta
        : null;
    const max =
      activeTarget
        ? getMaxChars(activeTarget)
        : DEFAULT_MAX;
    const over =
      projected !== null &&
      projected > max;
    if (over) {
      button.dataset.over = '1';
    }
    if (candidate.delta === 0) {
      button.dataset.exact = '1';
    }
    /* WORD */
    const label =
      document.createElement('span');
    label.className =
      'tw-vf-chip-word';
    label.textContent =
      applyCase(
        candidate.word,
        activeWord
      );
    /* DELTA */
    const meta =
      document.createElement('span');
    meta.className =
      'tw-vf-chip-meta';
    meta.textContent =
      deltaLabel(
        candidate.delta
      );
    button.append(
      label,
      meta
    );
    /* ACCESSIBILITY */
    button.setAttribute(
      'aria-label',
      `Replace ${activeWord} with ${label.textContent}. ` +
      `${candidate.chars} characters, ` +
      `${deltaLabel(candidate.delta)} character difference.` +
      (
        projected !== null
          ? ` Projected statement count ${projected} of ${max}.`
          : ''
      )
    );
    /* TOOLTIP */
    button.title =
      `${candidate.chars} chars • ` +
      `${deltaLabel(candidate.delta)} • ` +
      (
        projected !== null
          ? `${projected}/${max} projected`
          : ''
      );
    /* --------------------------------
       PREVIEW NEW CHARACTER COUNT
    -------------------------------- */
    button.addEventListener(
      'mouseenter',
      () => {
        if (projected !== null) {
          setStatementCount(
            projected,
            max,
            true
          );
        }
      }
    );
    button.addEventListener(
      'mouseleave',
      resetStatementCount
    );
    button.addEventListener(
      'focus',
      () => {
        if (projected !== null) {
          setStatementCount(
            projected,
            max,
            true
          );
        }
      }
    );
    button.addEventListener(
      'blur',
      resetStatementCount
    );
    /* --------------------------------
       KEEP TEXT SELECTION ACTIVE
    -------------------------------- */
    button.addEventListener(
      'mousedown',
      (event) => {
        event.preventDefault();
      }
    );
    /* --------------------------------
       REPLACE VERB
    -------------------------------- */
    button.addEventListener(
      'click',
      () => {
        replaceActiveWord(
          candidate.word
        );
      }
    );
    return button;
  }
  /* ==========================================================
     RENDER GROUP
  ========================================================== */
  function renderGroup(
    container,
    wrap,
    candidates
  ) {
    if (
      !container ||
      !wrap
    ) {
      return;
    }
    container.innerHTML = '';
    wrap.hidden =
      candidates.length === 0;
    candidates.forEach(
      (candidate) => {
        container.appendChild(
          makeChip(candidate)
        );
      }
    );
  }
  /* ==========================================================
     EMPTY STATE
  ========================================================== */
  function showEmpty(
    message =
      'Select a verb in your EPB/OPB statement.'
  ) {
    if (!root) {
      return;
    }
    root.dataset.state =
      'empty';
    if (els.empty) {
      els.empty.hidden = false;
    }
    if (els.active) {
      els.active.hidden = true;
    }
    if (els.message) {
      els.message.textContent =
        message;
    }
  }
  /* ==========================================================
     MAIN RENDER
  ========================================================== */
  function render() {
    if (
      !root ||
      !activeTarget ||
      !activeRange ||
      !activeWord
    ) {
      showEmpty();
      return;
    }
    const candidates =
      getCandidates(activeWord);
    const max =
      getMaxChars(activeTarget);
    root.dataset.state =
      'active';
    if (els.empty) {
      els.empty.hidden = true;
    }
    if (els.active) {
      els.active.hidden = false;
    }
    if (els.word) {
      els.word.textContent =
        activeWord;
    }
    if (els.wordChars) {
      els.wordChars.textContent =
        String(
          normalizeWord(
            activeWord
          ).length
        );
    }
    setStatementCount(
      activeTarget.value.length,
      max,
      false
    );
    /* --------------------------------
       UNKNOWN VERB
    -------------------------------- */
    if (!candidates.length) {
      renderGroup(
        els.same,
        els.sameWrap,
        []
      );
      renderGroup(
        els.close,
        els.closeWrap,
        []
      );
      renderGroup(
        els.other,
        els.otherWrap,
        []
      );
      if (els.more) {
        els.more.hidden = true;
      }
      if (els.message) {
        els.message.textContent =
          `No approved Verb Fit group yet for “${activeWord}”.`;
      }
      return;
    }
    if (els.message) {
      els.message.textContent = '';
    }
    /* --------------------------------
       GROUP BY CHARACTER DIFFERENCE
    -------------------------------- */
    const same =
      candidates.filter(
        (item) =>
          item.delta === 0
      );
    const close =
      candidates.filter(
        (item) =>
          item.delta !== 0 &&
          item.absDelta <= 3
      );
    const other =
      candidates.filter(
        (item) =>
          item.absDelta > 3
      );
    /* --------------------------------
       SAME LENGTH FIRST
    -------------------------------- */
    renderGroup(
      els.same,
      els.sameWrap,
      same
    );
    /* --------------------------------
       ±1 TO ±3 NEXT
    -------------------------------- */
    renderGroup(
      els.close,
      els.closeWrap,
      close
    );
    /* --------------------------------
       OTHER LENGTHS LAST
    -------------------------------- */
    renderGroup(
      els.other,
      els.otherWrap,
      showAll
        ? other
        : other.slice(0, 4)
    );
    /* --------------------------------
       MORE
    -------------------------------- */
    if (els.more) {
      els.more.hidden =
        other.length <= 4;
      els.more.textContent =
        showAll
          ? 'Less'
          : `More ${other.length}`;
      els.more.setAttribute(
        'aria-expanded',
        showAll
          ? 'true'
          : 'false'
      );
    }
  }
  /* ==========================================================
     UPDATE FROM TEXT FIELD
  ========================================================== */
  function updateFromTarget(el) {
    if (!isTarget(el)) {
      return;
    }
    activeTarget = el;
    const range =
      getWordRange(el);
    if (!range) {
      activeRange = null;
      activeWord = '';
      showEmpty(
        'Place the cursor on a verb or select one word.'
      );
      if (els.statementCount) {
        setStatementCount(
          el.value.length,
          getMaxChars(el),
          false
        );
      }
      return;
    }
    activeRange =
      range;
    activeWord =
      range.word;
    showAll =
      false;
    render();
  }
  /* ==========================================================
     REPLACE ACTIVE WORD
  ========================================================== */
  function replaceActiveWord(newWord) {
    if (
      !activeTarget ||
      !activeRange
    ) {
      return;
    }
    const source =
      activeTarget.value;
    const originalWord =
      activeWord;
    const replacement =
      applyCase(
        newWord,
        activeWord
      );
    const before =
      source.slice(
        0,
        activeRange.start
      );
    const after =
      source.slice(
        activeRange.end
      );
    const nextValue =
      before +
      replacement +
      after;
    const nextCaret =
      activeRange.start +
      replacement.length;
    /* --------------------------------
       REPLACE VALUE
    -------------------------------- */
    activeTarget.value =
      nextValue;
    /* --------------------------------
       RETURN FOCUS
    -------------------------------- */
    activeTarget.focus({
      preventScroll: true
    });
    /* --------------------------------
       SELECT NEW VERB
    -------------------------------- */
    activeTarget.setSelectionRange(
      activeRange.start,
      nextCaret
    );
    /* --------------------------------
       WEBFLOW / OTHER LISTENERS
    -------------------------------- */
    activeTarget.dispatchEvent(
      new Event(
        'input',
        {
          bubbles: true
        }
      )
    );
    activeTarget.dispatchEvent(
      new Event(
        'change',
        {
          bubbles: true
        }
      )
    );
    /* --------------------------------
       KEEP REPLACEMENT ACTIVE
    -------------------------------- */
    activeRange = {
      start:
        activeRange.start,
      end:
        nextCaret,
      word:
        replacement
    };
    activeWord =
      replacement;
    showAll =
      false;
    render();
    /* --------------------------------
       CUSTOM THEWING EVENT
       Future Amy/editor modules can listen:
       thewing:verb-replaced
    -------------------------------- */
    root?.dispatchEvent(
      new CustomEvent(
        'thewing:verb-replaced',
        {
          bubbles: true,
          detail: {
            from:
              normalizeWord(
                originalWord
              ),
            to:
              normalizeWord(
                replacement
              ),
            statementLength:
              nextValue.length,
            maxChars:
              getMaxChars(
                activeTarget
              )
          }
        }
      )
    );
  }
  /* ==========================================================
     EVENT HANDLING
  ========================================================== */
  function scheduleUpdate(el) {
    window.requestAnimationFrame(
      () => {
        updateFromTarget(el);
      }
    );
  }
  function bindGlobalEvents() {
    [
      'focusin',
      'click',
      'keyup',
      'select',
      'input'
    ].forEach(
      (eventName) => {
        document.addEventListener(
          eventName,
          (event) => {
            if (
              isTarget(
                event.target
              )
            ) {
              scheduleUpdate(
                event.target
              );
            }
          }
        );
      }
    );
    document.addEventListener(
      'selectionchange',
      () => {
        const el =
          document.activeElement;
        if (isTarget(el)) {
          scheduleUpdate(el);
        }
      }
    );
    if (els.more) {
      els.more.addEventListener(
        'click',
        () => {
          showAll =
            !showAll;
          render();
        }
      );
    }
  }
  /* ==========================================================
     INIT
  ========================================================== */
  function init() {
    if (!cacheElements()) {
      return;
    }
    rebuildIndex();
    bindGlobalEvents();
    showEmpty();
  }
  /* ==========================================================
     PUBLIC API
     Useful later when connecting Amy or other TheWing modules.
  ========================================================== */
  window.TheWingVerbFit = {
    refresh() {
      if (activeTarget) {
        updateFromTarget(
          activeTarget
        );
      }
    },
    addFamily(
      name,
      words
    ) {
      if (
        !name ||
        !Array.isArray(words) ||
        !words.length
      ) {
        return;
      }
      VERB_FAMILIES.push({
        name,
        words
      });
      rebuildIndex();
      if (activeTarget) {
        updateFromTarget(
          activeTarget
        );
      }
    },
    getFamilies() {
      return VERB_FAMILIES.map(
        (family) => ({
          name:
            family.name,
          words:
            [...family.words]
        })
      );
    }
  };
  /* ==========================================================
     START
  ========================================================== */
  if (
    document.readyState ===
    'loading'
  ) {
    document.addEventListener(
      'DOMContentLoaded',
      init,
      {
        once: true
      }
    );
  } else {
    init();
  }
})();
</script>
      </div>
    </li>
    <li></li>
  </ul>
